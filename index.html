<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Monitoring Produksi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/style.css" rel="stylesheet" />
  <link href="assets/login.css" rel="stylesheet" />
</head>
<body class="login-page">

  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <i class="bi bi-clipboard2-pulse brand-icon"></i>
      <h4 class="mt-2 mb-0 fw-bold">Monitoring Produksi</h4>
      <small class="text-muted">Portal Area Produksi</small>
    </div>

<form id="loginForm">
  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" id="username" class="form-control" 
           placeholder="cth: budi" autocomplete="username" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-control" 
           autocomplete="current-password" required />
  </div>
  <div id="errorMsg" class="alert alert-danger py-2 d-none"></div>
  <button type="submit" class="btn btn-primary w-100" id="btnLogin">
    <i class="bi bi-box-arrow-in-right"></i> Login
  </button>
</form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
